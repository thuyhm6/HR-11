<nz-modal [(nzVisible)]="visible" [nzTitle]="'topbar.changePassword' | translate:'Cập nhật mật khẩu'"
          [nzFooter]="null" [nzWidth]="480" (nzOnCancel)="close()">
  <ng-container *nzModalContent>
    <nz-alert *ngIf="errorMessage()" nzType="error" [nzMessage]="errorMessage()" class="mb-3"></nz-alert>
    <nz-alert *ngIf="successMessage()" nzType="success" [nzMessage]="successMessage()" class="mb-3"></nz-alert>

    <div class="mb-3">
      <label class="form-label fw-semibold">
        {{ 'pwd.oldPassword' | translate:'Mật khẩu cũ' }} <span class="text-danger">*</span>
      </label>
      <input nz-input type="password" [placeholder]="'pwd.placeholder.oldPassword' | translate:'Nhập mật khẩu cũ'"
             autocomplete="current-password" [(ngModel)]="oldPassword" name="oldPassword">
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">
        {{ 'pwd.newPassword' | translate:'Mật khẩu mới' }} <span class="text-danger">*</span>
      </label>
      <input nz-input type="password" [placeholder]="'fcp.newPassword.placeholder' | translate:'Tối thiểu 8 ký tự'"
             autocomplete="new-password" [(ngModel)]="newPassword" name="newPassword">
      <div class="form-text">{{ 'fcp.requirements' | translate:'Ít nhất 8 ký tự, gồm: chữ hoa, chữ thường, số và ký tự đặc biệt.' }}</div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">
        {{ 'pwd.confirmPassword' | translate:'Xác nhận mật khẩu mới' }} <span class="text-danger">*</span>
      </label>
      <input nz-input type="password" [placeholder]="'pwd.placeholder.confirmPassword' | translate:'Nhập lại mật khẩu mới'"
             autocomplete="new-password" [(ngModel)]="confirmPassword" name="confirmPassword">
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
      <button nz-button nzType="default" (click)="close()">{{ 'common.cancel' | translate:'Hủy' }}</button>
      <button nz-button nzType="primary" [nzLoading]="loading()" (click)="onSubmit()">
        <i class="bx bx-save me-1"></i>{{ 'pwd.update' | translate:'Cập nhật mật khẩu' }}
      </button>
    </div>
  </ng-container>
</nz-modal>
