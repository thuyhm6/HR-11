<div class="login-wrapper">
  <!-- LEFT: ảnh minh họa -->
  <div class="login-left">
    <div class="login-brand">
      <img src="/assets/images/HVV_logo_login.jpg" alt="VHR System">
    </div>
    <div class="login-image-wrap">
      <img src="/assets/images/login-img-1.jpg" alt="VHR System">
      <div class="login-tagline">
        <span>Đăng nhập vào hệ thống</span>
        <small>© 2026 VHR System. Tất cả quyền được bảo lưu.</small>
      </div>
    </div>
  </div>

  <!-- RIGHT: form đăng nhập -->
  <div class="login-right">
    <div class="login-card">
      <div class="login-right-header">
        <div class="icon-wrap"><i class="fas fa-sign-in-alt"></i></div>
        <h4>Đăng nhập</h4>
        <p>Đăng nhập vào hệ thống</p>
      </div>

      <div *ngIf="successMessage()" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>{{ successMessage() }}
      </div>
      <div *ngIf="errorMessage()" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>{{ errorMessage() }}
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-floating">
          <input type="text" class="form-control" id="username" name="username"
                 placeholder="Tên đăng nhập" [(ngModel)]="username" required>
          <label for="username"><i class="fas fa-user me-2"></i>Tên đăng nhập</label>
        </div>

        <div class="form-floating">
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="Mật khẩu" [(ngModel)]="password" required>
          <label for="password"><i class="fas fa-lock me-2"></i>Mật khẩu</label>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe"
                 [(ngModel)]="rememberMe" (change)="onRememberMeChange()">
          <label class="form-check-label" for="rememberMe">
            <i class="fas fa-bookmark me-2"></i>Ghi nhớ đăng nhập
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-login w-100" [disabled]="loading()">
          <i class="fas fa-sign-in-alt me-2"></i>{{ loading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
        </button>
      </form>

      <div class="login-footer">© 2026 VHR System. Tất cả quyền được bảo lưu.</div>
    </div>
  </div>
</div>
