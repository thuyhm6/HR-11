<nz-modal [nzVisible]="true" nzTitle="Yêu cầu đổi mật khẩu" [nzClosable]="false" [nzMaskClosable]="false"
          [nzKeyboard]="false" [nzFooter]="null" [nzWidth]="480">
  <ng-container *nzModalContent>
    <div class="alert-warning-box mb-3">
      Tài khoản của bạn đang sử dụng mật khẩu <strong>chưa được mã hóa</strong> từ hệ thống cũ.
      Vì lý do bảo mật, bạn <strong>bắt buộc phải đổi mật khẩu</strong> trước khi tiếp tục sử dụng hệ thống.
    </div>

    <nz-alert *ngIf="errorMessage()" nzType="error" [nzMessage]="errorMessage()" class="mb-3"></nz-alert>
    <nz-alert *ngIf="successMessage()" nzType="success" [nzMessage]="successMessage()" class="mb-3"></nz-alert>

    <div class="mb-3">
      <label class="form-label fw-semibold">Mật khẩu mới <span class="text-danger">*</span></label>
      <input nz-input type="password" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password"
             [(ngModel)]="newPassword" name="newPassword">
      <div class="form-text">Ít nhất 8 ký tự, gồm: chữ hoa, chữ thường, số và ký tự đặc biệt.</div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
      <input nz-input type="password" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password"
             [(ngModel)]="confirmPassword" name="confirmPassword">
    </div>

    <div class="d-flex justify-content-between mt-4">
      <a href="/logout" nz-button nzType="default">
        <i class="bx bx-log-out me-1"></i>Đăng xuất
      </a>
      <button nz-button nzType="primary" [nzLoading]="loading()" (click)="onSubmit()">
        <i class="bx bx-save me-1"></i>Đổi mật khẩu
      </button>
    </div>
  </ng-container>
</nz-modal>
