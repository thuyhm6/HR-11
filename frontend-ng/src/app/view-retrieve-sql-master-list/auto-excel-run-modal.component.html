<nz-modal [nzVisible]="visible" nzWidth="720px" [nzMaskClosable]="true" (nzOnCancel)="close()"
          [nzTitle]="'ar.viewRetrieveSqlMasterList.SHUJUDAOCHU.b' | translate:'Xuất dữ liệu'"
          [nzFooter]="aermFooterTpl">
  <ng-container *nzModalContent>
    <nz-spin [nzSpinning]="loading()">
      <ng-container *ngIf="master() as m">
        <div class="row g-2 mb-3">
          <div class="col-md-3">
            <label class="form-label fw-semibold">{{ 'disc.autoExcel.SQL_NO.Z' | translate:'STT SQL' }}</label>
            <div id="aerm-sql-seq" class="form-control-plaintext">{{ m.sqlSeq }}</div>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">{{ 'disc.autoExcel.SQL_MODULE.Z' | translate:'Module SQL' }}</label>
            <div id="aerm-pgm-nm" class="form-control-plaintext">{{ m.pgmNm }}</div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">{{ 'disc.autoExcel.SQL_NAME.Z' | translate:'Tên SQL' }}</label>
            <div id="aerm-sql-nm" class="form-control-plaintext">{{ m.sqlNm }}</div>
          </div>
        </div>

        <nz-alert *ngIf="m.isSpecial === 'Y'" nzType="info" nzShowIcon class="mb-3"
                  [nzMessage]="'autoExcel.hint.special' | translate:'Báo cáo mẫu đặc biệt: bản Angular xuất dạng bảng dữ liệu (chưa hỗ trợ template Excel riêng của bản cũ).'"></nz-alert>

        <div class="row g-3">
          <div class="col-md-6" *ngFor="let p of inputParams()">
            <label class="form-label fw-semibold" [attr.for]="'aerm-param-' + p.param" [attr.title]="p.param">{{ label(p) }}</label>
            <nz-date-picker *ngIf="isDate(p); else aermTextTpl" class="w-100" [id]="'aerm-param-' + p.param"
                            nzFormat="dd/MM/yyyy" [(ngModel)]="values[p.param]"></nz-date-picker>
            <ng-template #aermTextTpl>
              <input nz-input [id]="'aerm-param-' + p.param" [(ngModel)]="values[p.param]" [placeholder]="p.param">
            </ng-template>
          </div>
        </div>
        <div *ngIf="!inputParams().length" class="text-muted">
          {{ 'autoExcel.hint.noParams' | translate:'Báo cáo không có tham số cần nhập.' }}
        </div>
      </ng-container>
    </nz-spin>
  </ng-container>

  <ng-template #aermFooterTpl>
    <button nz-button type="button" (click)="close()">{{ 'common.close' | translate:'Đóng' }}</button>
    <button nz-button nzType="primary" type="button" [nzLoading]="running()" [disabled]="loading() || !master()" (click)="run()">
      <i class="bx bx-export"></i> {{ 'common.exportExcel' | translate:'Xuất Excel' }}
    </button>
  </ng-template>
</nz-modal>
